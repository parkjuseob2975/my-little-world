<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Little World</title>
<style>
:root{--ink:#332e36;--muted:#817986;--pink:#f5dce7;--lav:#e8e3f4;--cream:#fffaf5;--line:#eadfe6;--accent:#a65f80}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fbf2f5,#f4f0fb 55%,#fffaf1);font-family:Arial,'Malgun Gothic',sans-serif;color:var(--ink)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:700}button.secondary{background:#eee8f0;color:#574c5b}button.danger{background:#f4e2e2;color:#8a4141}.wrap{max-width:1120px;margin:auto;padding:26px 18px 50px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.brand{font-size:clamp(25px,4vw,38px);font-weight:900;letter-spacing:-1.5px}.brand span{color:var(--accent)}.sub{color:var(--muted);font-size:13px;margin-top:5px}.badge{background:#fff9;border:1px solid var(--line);border-radius:99px;padding:9px 13px;font-size:12px;color:#7b6373}.hero{background:#ffffffc9;border:1px solid #fff;border-radius:24px;padding:28px;box-shadow:0 14px 40px #73516a10;display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}.hero h1{margin:0 0 10px;font-size:clamp(24px,4vw,36px);letter-spacing:-1px}.hero p{margin:0;color:var(--muted);line-height:1.7}.profile{width:96px;height:96px;border-radius:28px;background:linear-gradient(135deg,var(--pink),var(--lav));display:grid;place-items:center;font-size:40px;border:4px solid white;box-shadow:0 4px 18px #6d506a16}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.toolbar button{background:#fff;color:#655767;border:1px solid var(--line)}.toolbar button.active{background:var(--accent);color:white;border-color:var(--accent)}.layout{display:grid;grid-template-columns:250px 1fr;gap:18px}.side,.panel{background:#ffffffd9;border:1px solid white;border-radius:20px;padding:20px;box-shadow:0 10px 30px #73516a0a}.side h3,.panel h2{margin:0 0 14px}.menu{display:grid;gap:8px}.menu button{text-align:left;background:#faf5f8;color:#645566;border:1px solid transparent}.menu button.active{background:#f3e1eb;border-color:#e7c6d7;color:#854d6b}.note{font-size:12px;line-height:1.6;color:var(--muted);margin-top:18px}.panel{min-height:360px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}.section-head h2{margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.card{border:1px solid var(--line);background:#fff;border-radius:16px;overflow:hidden}.thumb{height:125px;background:linear-gradient(135deg,#f7e4ed,#e9e5f7);display:grid;place-items:center;font-size:36px}.card-body{padding:13px}.card h3{font-size:15px;margin:0 0 7px}.meta{font-size:12px;color:var(--muted)}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:130px}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fff;color:var(--ink);outline-color:#d9a7c0}textarea{min-height:120px;resize:vertical}.form{display:grid;gap:10px;margin-bottom:18px}.entry{padding:15px;border:1px solid var(--line);border-radius:15px;margin-bottom:10px;background:#fff}.entry h3{margin:0 0 7px}.entry p{white-space:pre-wrap;line-height:1.65;margin:8px 0}.entry small{color:var(--muted)}.entry img{max-width:100%;max-height:260px;display:block;border-radius:12px;margin-top:10px}.empty{padding:45px 15px;text-align:center;color:var(--muted);background:#fcf8fb;border:1px dashed var(--line);border-radius:15px}.footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}.hidden{display:none!important}@media(max-width:700px){.layout{grid-template-columns:1fr}.hero{padding:21px}.profile{width:70px;height:70px;font-size:30px}.top{align-items:flex-start}.badge{max-width:130px;text-align:center}}
</style></head>
<body><div class="wrap">
<header class="top"><div><div class="brand">My <span>Little World</span></div><div class="sub">나만의 작은 공간 · memories, stories & little things</div></div><div class="badge">개인 홈페이지 시안</div></header>
<section class="hero"><div><h1 id="heroTitle">나의 작은 세상에 오신 걸 환영해요.</h1><p id="heroDesc">사진과 일기, 좋아하는 순간들을 천천히 모아두는 공간입니다.<br>오늘의 이야기를 하나씩 기록해 보세요.</p><div class="row" style="margin-top:16px;max-width:360px"><button onclick="showSection('diary')">오늘의 일기 쓰기</button><button class="secondary" onclick="showSection('photos')">사진첩 열기</button></div></div><div class="profile">☁️</div></section>
<nav class="toolbar"><button class="active" data-section="home" onclick="showSection('home')">홈</button><button data-section="diary" onclick="showSection('diary')">일기장</button><button data-section="photos" onclick="showSection('photos')">사진첩</button><button data-section="board" onclick="showSection('board')">게시판</button><button data-section="guestbook" onclick="showSection('guestbook')">방명록</button><button data-section="settings" onclick="showSection('settings')">꾸미기</button></nav>
<div class="layout"><aside class="side"><h3>내 공간 메뉴</h3><div class="menu"><button class="active" data-section="home" onclick="showSection('home')">⌂　홈</button><button data-section="diary" onclick="showSection('diary')">♡　일기장</button><button data-section="photos" onclick="showSection('photos')">▧　사진첩</button><button data-section="board" onclick="showSection('board')">✎　자유게시판</button><button data-section="guestbook" onclick="showSection('guestbook')">✉　방명록</button><button data-section="settings" onclick="showSection('settings')">⚙　홈페이지 꾸미기</button></div><div class="note">현재는 미리보기 버전입니다. 글과 사진은 이 브라우저에 저장됩니다. 다른 기기에서도 동일하게 보이게 하려면 온라인 데이터베이스와 파일 저장소 연결이 필요합니다.</div></aside><main class="panel" id="content"></main></div>
<div class="footer">Made for your own little world ✦</div></div>
<script>
const KEY='mlw_entries_v1',SET='mlw_settings_v1';let entries=JSON.parse(localStorage.getItem(KEY)||'[]');let settings=JSON.parse(localStorage.getItem(SET)||'{"title":"나의 작은 세상에 오신 걸 환영해요.","desc":"사진과 일기, 좋아하는 순간들을 천천히 모아두는 공간입니다.\n오늘의 이야기를 하나씩 기록해 보세요.","privacy":"mixed"}');let current='home';
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}function saveSettings(){localStorage.setItem(SET,JSON.stringify(settings))}function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateNow(){return new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'})}
function showSection(s){current=s;document.querySelectorAll('[data-section]').forEach(b=>b.classList.toggle('active',b.dataset.section===s));document.getElementById('heroTitle').textContent=settings.title;document.getElementById('heroDesc').innerHTML=esc(settings.desc).replace(/\n/g,'<br>');render()}
function formMarkup(type){let label=type==='diary'?'일기':type==='photos'?'사진':type==='board'?'게시글':'방명록';return `<form class="form" onsubmit="addEntry(event,'${type}')"><input name="title" placeholder="${label} 제목" required><textarea name="body" placeholder="무슨 이야기를 남길까요?" ${type==='photos'?'':'required'}></textarea>${type==='photos'?'<label class="meta">사진 파일 선택 (미리보기 저장)</label><input type="file" name="file" accept="image/*">':''}<div class="row"><select name="privacy"><option value="private">나만 보기</option><option value="public">공개 표시</option></select><button type="submit">저장하기</button></div></form>`}
function listMarkup(type){let items=entries.filter(e=>e.type===type).sort((a,b)=>b.time-a.time);if(!items.length)return '<div class="empty">아직 등록된 내용이 없어요.<br>첫 번째 기록을 남겨보세요.</div>';return items.map(e=>`<article class="entry"><div class="section-head"><div><h3>${esc(e.title)} ${e.privacy==='private'?'<span class="meta">🔒 나만 보기</span>':'<span class="meta">🌐 공개 표시</span>'}</h3><small>${new Date(e.time).toLocaleString('ko-KR')}</small></div><button class="danger" onclick="deleteEntry('${e.id}')">삭제</button></div>${e.body?`<p>${esc(e.body)}</p>`:''}${e.image?`<img src="${e.image}" alt="업로드한 사진">`:''}</article>`).join('')}
function render(){const c=document.getElementById('content');if(current==='home'){let count=t=>entries.filter(e=>e.type===t).length;c.innerHTML=`<div class="section-head"><h2>오늘의 내 공간</h2><span class="meta">${dateNow()}</span></div><p style="color:var(--muted);line-height:1.7">여기는 당신만의 작은 인터넷 공간이에요. 일기를 쓰고, 사진을 모으고, 좋아하는 이야기를 남겨보세요.</p><div class="grid"><div class="card"><div class="thumb">📔</div><div class="card-body"><h3>일기장</h3><div class="meta">기록 ${count('diary')}개</div><p><button onclick="showSection('diary')">일기 쓰기</button></p></div></div><div class="card"><div class="thumb">📷</div><div class="card-body"><h3>사진첩</h3><div class="meta">사진/앨범 ${count('photos')}개</div><p><button onclick="showSection('photos')">사진 올리기</button></p></div></div><div class="card"><div class="thumb">📝</div><div class="card-body"><h3>자유게시판</h3><div class="meta">게시글 ${count('board')}개</div><p><button onclick="showSection('board')">글 작성</button></p></div></div><div class="card"><div class="thumb">💌</div><div class="card-body"><h3>방명록</h3><div class="meta">글 ${count('guestbook')}개</div><p><button onclick="showSection('guestbook')">방명록 보기</button></p></div></div></div><h2 style="margin-top:25px">최근 기록</h2>${entries.length?entries.slice().sort((a,b)=>b.time-a.time).slice(0,3).map(e=>`<article class="entry"><h3>${esc(e.title)}</h3><small>${new Date(e.time).toLocaleDateString('ko-KR')} · ${({diary:'일기장',photos:'사진첩',board:'게시판',guestbook:'방명록'})[e.type]}</small><p>${esc(e.body||'사진을 기록했어요.').slice(0,150)}</p></article>`).join(''):'<div class="empty">최근 기록이 여기에 표시됩니다.</div>'}`;return}
if(['diary','photos','board','guestbook'].includes(current)){let names={diary:'일기장',photos:'사진첩',board:'자유게시판',guestbook:'방명록'};c.innerHTML=`<div class="section-head"><h2>${names[current]}</h2><span class="meta">나만의 기록을 남겨보세요</span></div>${formMarkup(current)}<h3>저장된 기록</h3>${listMarkup(current)}`;return}
if(current==='settings'){c.innerHTML=`<div class="section-head"><h2>홈페이지 꾸미기</h2></div><form class="form" onsubmit="updateSettings(event)"><label>메인 인사말</label><input name="title" value="${esc(settings.title)}" required><label>소개 문구</label><textarea name="desc">${esc(settings.desc)}</textarea><label>운영 방식</label><select name="privacy"><option value="mixed" ${settings.privacy==='mixed'?'selected':''}>공개/비공개를 함께 사용</option><option value="private" ${settings.privacy==='private'?'selected':''}>개인 기록 중심</option></select><button>변경사항 저장</button></form><div class="entry"><h3>중요한 안내</h3><p>현재 공개/비공개 선택은 이 브라우저에서 표시되는 라벨일 뿐, 실제 인터넷 접근을 막는 보안 기능은 아닙니다. 실제로 인터넷에 배포할 때는 로그인, 서버 측 권한 검사, 안전한 파일 저장소를 연결해야 비공개 글과 사진을 보호할 수 있습니다.</p></div><button class="secondary" onclick="exportData()">내 기록 백업 파일 받기</button> <button class="danger" onclick="clearData()">이 브라우저의 기록 모두 삭제</button>`}}
function addEntry(ev,type){ev.preventDefault();let f=ev.target, file=f.file?.files?.[0];const commit=image=>{entries.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),type,title:f.title.value.trim(),body:f.body.value.trim(),privacy:f.privacy.value,image,time:Date.now()});save();render()};if(file){if(file.size>2*1024*1024){alert('미리보기 버전은 사진 한 장당 2MB 이하를 권장합니다.');return}let r=new FileReader();r.onload=()=>commit(r.result);r.readAsDataURL(file)}else commit('')}
function deleteEntry(id){if(confirm('이 기록을 삭제할까요?')){entries=entries.filter(e=>e.id!==id);save();render()}}function updateSettings(ev){ev.preventDefault();let f=ev.target;settings={title:f.title.value,desc:f.desc.value,privacy:f.privacy.value};saveSettings();showSection(current);alert('홈페이지 설정을 저장했어요.')}function exportData(){let blob=new Blob([JSON.stringify({entries,settings},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='my-little-world-backup.json';a.click();URL.revokeObjectURL(a.href)}function clearData(){if(confirm('이 브라우저에 저장된 모든 기록을 삭제할까요? 이 작업은 되돌릴 수 없습니다.')){entries=[];save();render()}}showSection('home');
</script></body></html>
